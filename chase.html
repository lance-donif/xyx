<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102623">
  <meta name="description" content="在林地与海岸间骑行，甩开山狼，收集金币，刷新你的逃亡距离。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23102623'/%3E%3Cpath d='M6 46 24 15l8 13 9-17 17 35H45l-6-13-7 12-9-13-8 14z' fill='%23efd16c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/chase.css">
  <title>骑行逃亡 · RIDGE ESCAPE</title>
</head>
<body data-phase="ready">
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="mountains" viewBox="0 0 52 36"><path fill="currentColor" fill-rule="evenodd" d="M1 32L18 6l6 9L34 1l17 31H38L32 21l-4 6-6-9-8 14zm16 0 6-9 6 9zm13-16 4 7 2-3 5 8h3L34 11z"/></symbol>
    <symbol id="forward" viewBox="0 0 24 24"><path d="M3 12h17m-7-7 7 7-7 7"/></symbol>
    <symbol id="wolf" viewBox="0 0 28 28"><path d="m4 3 7 4h6l7-4-1 11-5 5-4 6-4-6-5-5z"/><path d="m8 12 3 2m9-2-3 2m-5 5h4l-2 2z"/></symbol>
    <symbol id="coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m12 7 3 5-3 5-3-5z"/></symbol>
    <symbol id="pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="compass" viewBox="0 0 24 24"><path d="m18 6-4 8-8 4 4-8z"/><circle cx="12" cy="12" r="9"/></symbol>
  </svg>
  <canvas id="chase-canvas" tabindex="-1" aria-label="骑行逃亡赛道"></canvas>
  <div class="scrim" aria-hidden="true"></div>
  <header class="topbar" id="chase-topbar">
    <a class="brand" href="./index.html" aria-label="返回山脊骑行主页"><svg aria-hidden="true"><use href="#mountains"/></svg><b>RIDGELINE</b></a>
    <button id="chase-pause" class="round" type="button" aria-label="暂停" title="暂停" hidden><svg aria-hidden="true"><use href="#pause"/></svg></button>
  </header>
  <main class="launch" id="chase-launch">
    <div class="intro">
      <p class="edition"><span></span> RIDGE ESCAPE</p>
      <h1>骑行逃亡</h1>
      <p class="brief">身后是两只山狼。沿山路骑行、避开障碍，<br class="wide">尽可能多地收集金币。</p>
      <div class="launch-actions">
        <button id="chase-start" class="primary" disabled>开始逃亡 <svg aria-hidden="true"><use href="#forward"/></svg></button>
        <button class="ghost" data-show-help>操作指南</button>
      </div>
      <button class="tips-toggle" data-tips type="button" aria-pressed="true"><span class="switch" aria-hidden="true"></span>骑行提示</button>
    </div>
  </main>
  <section id="chase-hud" class="hud" aria-label="骑行状态" hidden>
    <div class="ride-stats">
      <div class="odometer"><div class="stat-caption"><span class="route-dot"></span><span id="chase-biome">林地</span></div><div class="meters"><strong id="chase-distance">0</strong><span>米</span></div></div>
      <div class="coin-count" aria-label="金币"><svg aria-hidden="true"><use href="#coin"/></svg><b id="chase-coins">0</b></div>
    </div>
    <div id="chase-danger" class="danger" data-level="far"><svg aria-hidden="true"><use href="#wolf"/></svg><span id="chase-threat">已拉开距离</span></div>
    <div id="chase-hint" class="hint" aria-live="polite" hidden></div>
  </section>
  <div id="chase-ending" class="ending" role="status" hidden></div>
  <section class="modal-layer" id="chase-paused" role="dialog" aria-modal="true" aria-labelledby="paused-title" hidden>
    <div class="panel">
      <p class="edition"><span></span> PAUSED</p>
      <h2 id="paused-title">骑行暂停</h2>
      <button id="chase-resume" class="primary">继续骑行 <svg aria-hidden="true"><use href="#forward"/></svg></button>
      <div class="panel-actions"><button class="ghost" id="chase-restart">重新出发</button><button class="ghost" data-show-help>操作指南</button></div>
      <div class="panel-footer"><button class="tips-toggle" data-tips aria-pressed="true"><span class="switch" aria-hidden="true"></span>骑行提示</button><a href="./index.html">返回主页</a></div>
    </div>
  </section>
  <section class="modal-layer" id="chase-over" role="dialog" aria-modal="true" aria-labelledby="over-title" hidden>
    <div class="panel">
      <p class="edition"><span></span> RIDE REPORT</p>
      <h2 id="over-title">本次逃亡</h2>
      <p id="chase-reason" class="reason"></p>
      <dl class="results">
        <div class="result-main"><dt>骑行距离</dt><dd><strong id="result-distance">0</strong> 米</dd></div>
        <div><dt>收集金币</dt><dd id="result-coins">0</dd></div>
        <div><dt>最远纪录</dt><dd><b id="result-best">0</b> 米</dd></div>
      </dl>
      <button id="chase-retry" class="primary">再次出发 <svg aria-hidden="true"><use href="#forward"/></svg></button>
      <div class="panel-footer end-footer"><a href="./index.html">返回主页</a></div>
    </div>
  </section>
  <dialog id="chase-help" class="guide" aria-labelledby="guide-title">
    <div class="guide-head">
      <div><p class="edition"><span></span> FIELD GUIDE</p><h2 id="guide-title">操作指南</h2></div>
      <button class="round" id="chase-help-close" aria-label="关闭操作指南"><svg aria-hidden="true"><use href="#close"/></svg></button>
    </div>
    <table class="instructions">
      <thead><tr><th scope="col">动作</th><th scope="col">触屏</th><th scope="col">键盘</th></tr></thead>
      <tbody>
        <tr><th scope="row">横向移动</th><td>按住横拖</td><td><kbd>A</kbd><kbd>D</kbd></td></tr>
        <tr><th scope="row">路口转弯</th><td>快速左滑 / 右滑</td><td><kbd>←</kbd><kbd>→</kbd></td></tr>
        <tr><th scope="row">跃起</th><td>向上滑</td><td><kbd>↑</kbd></td></tr>
        <tr><th scope="row">俯身</th><td>向下滑</td><td><kbd>↓</kbd></td></tr>
      </tbody>
    </table>
    <button id="chase-help-done" class="primary">知道了 <svg aria-hidden="true"><use href="#forward"/></svg></button>
  </dialog>
  <noscript>请开启 JavaScript 以加载骑行逃亡。</noscript>
  <script type="importmap">{"imports":{"three":"./vendor/three-r187.js","three/addons/utils/BufferGeometryUtils.js":"./vendor/BufferGeometryUtils.js"}}</script>
  <script type="module" src="./src/chase.js"></script>
</body>
</html>
