<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#162322">
  <meta name="description" content="在树林、山村与海岸之间疾驰，穿过八道计时门，挑战个人纪录。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2056%2048%22%3E%3Crect%20width%3D%2256%22%20height%3D%2248%22%20rx%3D%226%22%20fill%3D%22%23101d21%22%2F%3E%3Cpath%20transform%3D%22translate%282%205%29%22%20fill%3D%22%23ff783f%22%20fill-rule%3D%22evenodd%22%20d%3D%22M1%2032L18%206l6%209L34%201l17%2031H38L32%2021l-4%206-6-9-8%2014zm16%200%206-9%206%209zm13-16%204%207%202-3%205%208h3L34%2011z%22%2F%3E%3C%2Fsvg%3E">
  <title>RIDGELINE 山脊骑行</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body data-state="menu">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="ridge" viewBox="0 0 52 36">
      <path fill="currentColor" d="M1 32L18 6l6 9L34 1l17 31H38L32 21l-4 6-6-9-8 14zm16 0 6-9 6 9zm13-16 4 7 2-3 5 8h3L34 11z" fill-rule="evenodd"/>
    </symbol>
    <symbol id="flag-icon" viewBox="0 0 24 24">
      <path d="M4 21V3m.5 1c5-3 9.5 2.5 15-1v10c-5.5 3.5-10-2-15 1z"/>
      <path d="m9 4-.2 4 5 1 .1 4m0-9-.1 5 5 .1" />
    </symbol>
    <symbol id="sound-icon" viewBox="0 0 24 24">
      <path d="M3 9h4l5-4v14l-5-4H3z"/>
      <path class="waves" d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/>
    </symbol>
    <symbol id="mute-icon" viewBox="0 0 24 24">
      <path d="M3 9h4l5-4v14l-5-4H3zM16.5 9l5 6m0-6-5 6"/>
    </symbol>
    <symbol id="pause-icon" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="3"/></symbol>
    <symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M3 12h17m-7-7 7 7-7 7"/></symbol>
    <symbol id="clock-icon" viewBox="0 0 24 24"><circle cx="12" cy="14" r="7.5"/><path d="M12 10v4l2.5 1.4M9.5 3h5M18 7l1.5-1.5"/></symbol>
    <symbol id="moto-icon" viewBox="0 0 32 24">
      <circle cx="6" cy="16.5" r="4"/><circle cx="26" cy="16.5" r="4"/>
      <path d="m4 10 6 1 3-3 7 1 3 7 3 .5-5-12h-4M6 16.5l6-5 5 5h-6l-3-5m9 5 4-5"/>
    </symbol>
    <symbol id="cycle-icon" viewBox="0 0 32 24">
      <circle cx="6" cy="16.5" r="4.5"/><circle cx="26" cy="16.5" r="4.5"/>
      <path d="m6 16.5 6-9 4.5 9H6l14-10 6 10m-7-13H23l.5 2M9 6h5"/>
    </symbol>
    <symbol id="left-icon" viewBox="0 0 24 24"><path d="m14.5 5-7 7 7 7"/></symbol>
    <symbol id="right-icon" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  </svg>
  <canvas id="world" aria-label="第三人称骑行赛道"></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="menu-shade" aria-hidden="true"></div>

  <header class="masthead">
    <div class="brand" aria-label="RIDGELINE 山脊骑行">
      <svg class="brand-mark" aria-hidden="true"><use href="#ridge"/></svg>
      <span class="brand-type">RIDGELINE</span>
      <span class="brand-cn">山脊骑行</span>
    </div>
    <div class="top-actions">
      <a class="chase-entry" href="./chase.html">骑行逃亡 <span aria-hidden="true">↗</span></a>
      <button id="mute" class="icon-button" aria-label="静音" title="声音开关" aria-pressed="false">
        <svg class="sound-on" aria-hidden="true"><use href="#sound-icon"/></svg>
        <svg class="sound-off" aria-hidden="true"><use href="#mute-icon"/></svg>
      </button>
      <button id="pause" class="icon-button" aria-label="暂停" title="暂停 (P)">
        <svg aria-hidden="true"><use href="#pause-icon"/></svg>
      </button>
    </div>
  </header>

  <main class="launch" aria-label="比赛设置">
    <div class="launch-inner">
      <div class="course-meta">
        <span class="course-class"><svg aria-hidden="true"><use href="#flag-icon"/></svg> 计时挑战</span>
        <span class="course-length">1.20 <small>KM</small></span>
      </div>
      <h1 id="course-title">ALPINE <br>DESCENT</h1>
      <p class="brief"><b id="course-name">松冠山道</b><span class="brief-split" aria-hidden="true"></span>穿过 8 道橙色计时门，漏过每道加时 3 秒。</p>
      <div class="choices">
        <div class="option-row" role="group" aria-labelledby="route-label">
          <span class="label" id="route-label">赛道</span>
          <div class="segments">
            <button type="button" data-route="alpine" aria-pressed="true">松冠山道</button>
            <button type="button" data-route="coast" aria-pressed="false">翡翠海岸</button>
          </div>
        </div>
        <div class="option-row" role="group" aria-labelledby="ride-label">
          <span class="label" id="ride-label">座驾</span>
          <div class="segments vehicles">
            <button type="button" data-vehicle="moto" aria-pressed="true"><svg aria-hidden="true"><use href="#moto-icon"/></svg>摩托车</button>
            <button type="button" data-vehicle="cycle" aria-pressed="false"><svg aria-hidden="true"><use href="#cycle-icon"/></svg>公路自行车</button>
          </div>
        </div>
      </div>
      <button id="start" class="primary" type="button"><span>出发</span><svg aria-hidden="true"><use href="#arrow-icon"/></svg></button>
    </div>
  </main>

  <div class="controls-legend" aria-label="操作说明">
    <span><kbd>A</kbd><kbd>D</kbd> 转向</span>
    <span><kbd>W</kbd> 加速</span>
    <span><kbd>S</kbd> 刹车</span>
    <span><kbd>P</kbd> 暂停</span>
  </div>

  <section id="hud" aria-label="比赛仪表">
    <div class="course-hud">
      <div class="course-hud-names"><strong id="hud-course-name">松冠山道</strong><span id="distance">0.00 / 1.20 km</span></div>
      <div class="progress-track"><div id="progress"></div></div>
    </div>
    <div class="timings">
      <div class="metric"><svg aria-hidden="true"><use href="#clock-icon"/></svg><span class="sr-only">用时</span><b id="chrono">00:00.00</b></div>
      <div class="metric"><svg aria-hidden="true"><use href="#flag-icon"/></svg><span class="sr-only">计时门</span><b id="gates">0 / 8</b></div>
    </div>
    <div class="speedometer"><div class="speed-rule" aria-hidden="true"></div><strong id="speed">0</strong><span>KM/H</span></div>
  </section>
  <div id="notice" role="status" aria-live="polite"></div>
  <div class="touch-controls" aria-label="触屏骑行操作">
    <div class="steering">
      <button data-input="left" aria-label="向左转向"><svg aria-hidden="true"><use href="#left-icon"/></svg></button>
      <button data-input="right" aria-label="向右转向"><svg aria-hidden="true"><use href="#right-icon"/></svg></button>
    </div>
    <div class="pedals"><button data-input="brake">刹车</button><button data-input="boost">加速</button></div>
  </div>

  <section class="overlay pause-layer" role="dialog" aria-modal="true" aria-labelledby="pause-heading">
    <div class="finish-panel">
      <div class="panel-stripe" aria-hidden="true"></div>
      <p class="panel-label">暂停比赛</p>
      <h2 id="pause-heading">PAUSED</h2>
      <button class="primary" id="resume">继续骑行 <svg aria-hidden="true"><use href="#arrow-icon"/></svg></button>
      <button class="secondary" id="restart">重新出发</button>
      <button class="back-link" data-menu>返回选道</button>
    </div>
  </section>
  <section class="overlay results-layer" role="dialog" aria-modal="true" aria-labelledby="result-heading">
    <div class="finish-panel">
      <div class="panel-stripe" aria-hidden="true"></div>
      <p class="panel-label">冲线成绩</p>
      <h2 id="result-heading">FINISH!</h2>
      <dl class="result-list">
        <div class="total"><dt>最终用时</dt><dd id="result-time">—</dd></div>
        <div><dt>通过计时门</dt><dd id="result-gates">—</dd></div>
        <div><dt>漏门加时</dt><dd id="result-penalty">—</dd></div>
        <div><dt>个人最佳</dt><dd id="result-best">—</dd></div>
      </dl>
      <button class="primary" id="replay">再次挑战 <svg aria-hidden="true"><use href="#arrow-icon"/></svg></button>
      <button class="secondary" id="menu">返回选道</button>
    </div>
  </section>
  <noscript>请开启 JavaScript 以加载三维赛道。</noscript>
  <script type="importmap">{"imports":{"three":"./vendor/three-r187.js","three/addons/utils/BufferGeometryUtils.js":"./vendor/BufferGeometryUtils.js"}}</script>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
